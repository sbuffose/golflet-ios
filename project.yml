name: Golflet
options:
  bundleIdPrefix: com.sbuffose
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    DEVELOPMENT_TEAM: R56Y2GZ2M9
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_PREVIEWS: "YES"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Golflet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Golflet/Sources
        type: group
      - path: Golflet/Resources
        type: group
    resources:
      - path: Golflet/Resources/Assets.xcassets
      - path: Golflet/Resources/Fonts/Geist-Regular.otf
      - path: Golflet/Resources/Fonts/Geist-Medium.otf
      - path: Golflet/Resources/Fonts/Geist-SemiBold.otf
      - path: Golflet/Resources/Fixtures
        type: folder
    info:
      path: Golflet/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
          - en
        CFBundleDisplayName: Golflet
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Geist-Regular.otf
          - Geist-Medium.otf
          - Geist-SemiBold.otf
        NSLocationWhenInUseUsageDescription: Golflet usa tu ubicación mientras jugás para calcular la distancia al green y guardar el punto de cada golpe.
        NSMicrophoneUsageDescription: Golflet usa el micrófono para grabar el recap de la ronda y transcribir cómo te fue.
        NSSpeechRecognitionUsageDescription: Golflet transcribe en el iPhone lo que contás de la ronda para armar el recap, sin mandar el audio a un servicio de transcripción.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.sbuffose.golflet
            CFBundleURLSchemes:
              - golflet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbuffose.golflet
        PRODUCT_NAME: Golflet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: R56Y2GZ2M9
        INFOPLIST_FILE: Golflet/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
          PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Golflet AppStore GHA v2"
    entitlements:
      path: Golflet/Golflet.entitlements
    dependencies:
      - target: GolfletKit
      - target: GolfletWidgets
        embed: true
        codeSign: true

  GolfletKit:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GolfletKit
        type: group
    settings:
      base:
        PRODUCT_NAME: GolfletKit
        PRODUCT_MODULE_NAME: GolfletKit
        PRODUCT_BUNDLE_IDENTIFIER: com.sbuffose.golflet.kit
        SKIP_INSTALL: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"

  GolfletWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GolfletWidgets
        type: group
    info:
      path: GolfletWidgets/Info.plist
      properties:
        CFBundleDisplayName: Golflet
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbuffose.golflet.widgets
        PRODUCT_NAME: GolfletWidgets
        INFOPLIST_FILE: GolfletWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
          PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Golflet Widgets AppStore GHA"
    entitlements:
      path: GolfletWidgets/GolfletWidgets.entitlements
    dependencies:
      - target: GolfletKit

  GolfletTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GolfletTests
        type: group
    resources:
      - path: Golflet/Resources/Fixtures
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbuffose.golflet.tests
        DEVELOPMENT_TEAM: R56Y2GZ2M9
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Golflet.app/Golflet"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Golflet

  GolfletUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GolfletUITests
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbuffose.golflet.uitests
        DEVELOPMENT_TEAM: R56Y2GZ2M9
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: ""
        BUNDLE_LOADER: ""
    dependencies:
      - target: Golflet

schemes:
  Golflet:
    build:
      targets:
        Golflet: all
        GolfletKit: all
        GolfletWidgets: all
        GolfletTests: [test]
        GolfletUITests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: IDEPreferLogStreaming
          value: "YES"
    test:
      config: Debug
      gatherCoverageData: false
      environmentVariables:
        - variable: SCREENSHOT_DIR
          value: /tmp/golflet-screenshots
      targets:
        - name: GolfletTests
          parallelizable: false
        - name: GolfletUITests
          parallelizable: false
          randomExecutionOrder: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
