name: Golflet
options:
  bundleIdPrefix: com.sbuffose
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    DEVELOPMENT_TEAM: R56Y2GZ2M9
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_PREVIEWS: "YES"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Golflet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Golflet/Sources
        type: group
    resources:
      - path: Golflet/Resources/Assets.xcassets
      - path: Golflet/Resources/Fixtures
        type: folder
      - path: Golflet/Resources/Fixtures/rounds.json
      - path: Golflet/Resources/Fixtures/courses.json
      - path: Golflet/Resources/Fixtures/tees.json
      - path: Golflet/Resources/Fixtures/per_hole_stats.json
      - path: Golflet/Resources/Fonts/Geist-Regular.otf
      - path: Golflet/Resources/Fonts/Geist-Medium.otf
      - path: Golflet/Resources/Fonts/Geist-SemiBold.otf
    info:
      path: Golflet/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
          - en
        CFBundleDisplayName: Golflet
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Geist-Regular.otf
          - Geist-Medium.otf
          - Geist-SemiBold.otf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbuffose.golflet
        PRODUCT_NAME: Golflet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        DEVELOPMENT_TEAM: R56Y2GZ2M9
        INFOPLIST_FILE: Golflet/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
          PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Golflet AppStore GHA"
    entitlements:
      path: Golflet/Golflet.entitlements

  GolfletTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GolfletTests
        type: group
    resources:
      - path: Golflet/Resources/Fixtures
        type: folder
      - path: Golflet/Resources/Fixtures/rounds.json
      - path: Golflet/Resources/Fixtures/courses.json
      - path: Golflet/Resources/Fixtures/tees.json
      - path: Golflet/Resources/Fixtures/per_hole_stats.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbuffose.golflet.tests
        DEVELOPMENT_TEAM: R56Y2GZ2M9
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Golflet.app/Golflet"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Golflet

  GolfletUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GolfletUITests
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbuffose.golflet.uitests
        DEVELOPMENT_TEAM: R56Y2GZ2M9
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: ""
        BUNDLE_LOADER: ""
    dependencies:
      - target: Golflet

schemes:
  Golflet:
    build:
      targets:
        Golflet: all
        GolfletTests: [test]
        GolfletUITests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: IDEPreferLogStreaming
          value: "YES"
    test:
      config: Debug
      gatherCoverageData: false
      environmentVariables:
        - variable: SCREENSHOT_DIR
          value: /tmp/golflet-screenshots
      targets:
        - name: GolfletTests
          parallelizable: false
        - name: GolfletUITests
          parallelizable: false
          randomExecutionOrder: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
