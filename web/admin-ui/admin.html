<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F5F0">
<title>Golflet · Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/tokens.css">
<style>
*{box-sizing:border-box;font-style:normal}
html,body{margin:0;background:var(--color-bg);color:var(--color-ink);font-family:var(--font-ui);font-size:15px;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px 22px;background:rgba(247,245,240,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--color-hairline)}
.overline{font-size:11px;font-weight:600;letter-spacing:.127em;text-transform:uppercase;color:var(--color-ink2)}
.top h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.025em}
.top .sp{flex:1}
.wrap{max-width:1360px;margin:0 auto;padding:20px 22px 60px}
.card{background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:16px}
.btn{border:0;border-radius:999px;background:var(--color-primary);color:var(--color-onPrimary);font-weight:600;padding:10px 16px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn.ghost{background:var(--color-surface2);color:var(--color-ink)}
.btn.gold{background:var(--color-accent);color:#1d1a12}
.btn.neg{background:#F6E5DF;color:var(--color-negative)}
.confirm-row{margin-top:10px;background:#F8ECE6;border-radius:12px;padding:12px 14px;max-width:520px;white-space:normal;text-align:left}
.confirm-row p{margin:0 0 10px;font-size:13.5px;line-height:1.45;color:#7A3A26}
.confirm-acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .confirm-row{flex-basis:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:7px 12px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600;background:var(--color-surface2);color:var(--color-ink2);white-space:nowrap}
.chip.draft{background:var(--color-accentSoft);color:#8a6b2f}
.chip.published{background:#DCEBE2;color:var(--color-positive)}
.chip.changed{background:#F6E5DF;color:var(--color-negative)}
.grid{display:grid;grid-template-columns:250px minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:1340px){.grid{grid-template-columns:220px minmax(0,1fr)} .side{grid-column:1 / -1;position:static}}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.holes{display:flex;flex-direction:column;gap:2px;padding:6px}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.hrow:hover{background:var(--color-surface2)}
.hrow.on{background:var(--color-primary);color:var(--color-onPrimary)}
.hrow.on .chip{background:rgba(255,255,255,.16);color:var(--color-onPrimary)}
.hrow b{width:24px;font-size:17px;font-weight:600}
.hrow .t{flex:1;min-width:0;font-size:13px;line-height:1.25}
.hrow .t span{display:block;color:var(--color-ink3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow.on .t span{color:rgba(247,245,240,.7)}
h2{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:0 0 10px}
h3{font-size:13px;font-weight:600;margin:18px 0 8px;color:var(--color-ink2);letter-spacing:.02em;text-transform:uppercase}
label{display:block;font-size:12.5px;font-weight:500;color:var(--color-ink2);margin:10px 0 5px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--color-hairline);background:var(--color-bg);border-radius:10px;padding:9px 11px;font-size:14.5px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--color-primary2);background:#fff}
textarea{min-height:84px;resize:vertical;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hz{display:grid;grid-template-columns:26px 120px 140px 74px 74px minmax(0,1fr) 30px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--color-hairline)}
.hz:first-of-type{border-top:0}
.hz .n{width:22px;height:22px;border-radius:50%;background:var(--color-accent);color:#1d1a12;display:grid;place-items:center;font-size:11.5px;font-weight:700;cursor:pointer}
.hz .n.off{background:var(--color-surface2);color:var(--color-ink3)}
.hz input,.hz select{padding:7px 8px;font-size:13.5px}
.hz .x{border:0;background:none;color:var(--color-ink3);cursor:pointer;font-size:18px}
.hzh{display:grid;grid-template-columns:26px 120px 140px 74px 74px minmax(0,1fr) 30px;gap:6px;font-size:11.5px;color:var(--color-ink3);font-weight:600}
@media (max-width:760px){.hz,.hzh{grid-template-columns:24px 1fr 1fr 60px 60px 26px}.hz .note,.hzh .note{grid-column:2 / -1}}
.src{font-size:10.5px;color:#8a6b2f;font-weight:600}
.side{position:sticky;top:78px;display:flex;flex-direction:column;gap:12px}
.map{background:#E7EFDF;border-radius:var(--radius-md);overflow:hidden;position:relative}
.map svg{display:block;width:100%;height:auto;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--color-ink2);padding:8px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.meta{font-size:12px;color:var(--color-ink3);line-height:1.5}
.save{font-size:12.5px;color:var(--color-ink3)}
.save.dirty{color:#8a6b2f}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:900px){.levels{grid-template-columns:1fr}}
.levels .card{box-shadow:none;background:var(--color-bg);padding:12px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.course{display:block;text-decoration:none}
.course .k{font-size:20px;font-weight:600;letter-spacing:-.02em}
.bar{height:6px;border-radius:3px;background:var(--color-surface2);overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:var(--color-primary)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--color-ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.err{background:var(--color-negative)}
.empty{color:var(--color-ink3);font-size:13.5px;padding:8px 0}
.ov{display:flex;gap:10px;align-items:center;justify-content:space-between}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;height:100vh;overflow:auto;background:var(--color-primary);color:var(--color-onPrimary);padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand b{font-size:18px;font-weight:600;letter-spacing:-.03em}
.brand span{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:rgba(247,245,240,.78);text-decoration:none;font-size:14.5px;font-weight:500}
.nav a:hover{background:rgba(247,245,240,.08);color:var(--color-onPrimary)}
.nav a.on{background:rgba(247,245,240,.14);color:var(--color-onPrimary)}
.nav a.on::before{content:"";width:3px;height:16px;border-radius:2px;background:var(--color-accent);margin-left:-6px;margin-right:-1px}
.nav .grp{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(247,245,240,.45);padding:14px 12px 4px}
.nav .me{margin-top:auto;padding:14px 12px 4px;font-size:12.5px;color:rgba(247,245,240,.7);line-height:1.45;border-top:1px solid rgba(247,245,240,.12)}
.nav .me b{display:block;color:var(--color-onPrimary);font-weight:600}
.nav .me a{padding:6px 0;color:var(--color-accent);font-size:13px}
@media (max-width:860px){.app{grid-template-columns:1fr}.nav{position:static;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:10px}.brand,.nav .grp,.nav .me{display:none}.nav .me-acts{flex-direction:row;padding:0;gap:8px;align-items:center}.nav .me-acts a{color:var(--color-onPrimary)}.nav a{white-space:nowrap}}
.content{min-width:0}
/* ---------- dashboard ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;margin-bottom:18px}
a.tile{display:block;text-decoration:none;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:14px 16px 13px;transition:transform var(--motion-fast) var(--motion-curve),box-shadow var(--motion-fast)}
a.tile:hover{transform:translateY(-1px);box-shadow:var(--shadow-float)}
.tile .l{font-size:12.5px;font-weight:500;color:var(--color-ink2);display:flex;justify-content:space-between;gap:6px}
.tile .l::after{content:"›";color:var(--color-ink3);font-size:16px;line-height:1}
.tile .v{font-size:32px;font-weight:600;letter-spacing:-.044em;font-variant-numeric:tabular-nums;margin:6px 0 2px;color:var(--color-primary)}
.tile .v.zero{color:var(--color-ink3)}
.tile .s{font-size:12px;color:var(--color-ink3);line-height:1.4;font-variant-numeric:tabular-nums}
.tile.gold{background:var(--color-primary)}.tile.gold .l,.tile.gold .s{color:rgba(247,245,240,.72)}.tile.gold .v{color:var(--color-accent)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:24px 0 10px}
.sec h2{margin:0}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
@media (max-width:520px){.charts{grid-template-columns:1fr}}
.chart svg{display:block;width:100%;height:auto}
.chart .bar-hit{cursor:pointer}
.chart .bar-hit:hover rect.b{fill:var(--color-accent)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--color-ink3);padding:8px 10px;border-bottom:1px solid var(--color-hairline);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.n,.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--color-hairline);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.rl{cursor:pointer}.tbl tr.rl:hover td{background:var(--color-bg)}
.tbl td a{color:var(--color-primary);font-weight:600;text-decoration:none}
.tbl td a:hover{text-decoration:underline}
.tscroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:0 0 14px}
.filters label{margin:0 0 4px}
.filters select,.filters input[type=text],.filters input[type=search]{width:auto;min-width:150px;padding:8px 10px;font-size:13.5px}
.filters .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-ink2);padding-bottom:8px}
.yes{color:var(--color-positive);font-weight:600}.no{color:var(--color-ink3)}
.chip.ok,.chip.ios{background:#DCEBE2;color:var(--color-positive)}
.chip.error,.chip.fail{background:#F6E5DF;color:var(--color-negative)}
.chip.admin{background:var(--color-primary);color:var(--color-onPrimary)}
.chip.editor,.chip.web{background:var(--color-accentSoft);color:#8a6b2f}
.chip.partial{background:#E7EFDF;color:var(--color-primary2)}
.note{background:var(--color-accentSoft);color:#6d5427;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;margin:0 0 12px}
.nav .me-acts{display:flex;flex-direction:column;gap:6px;padding:8px 12px 4px}
.nav .me-acts a{padding:6px 0;color:var(--color-accent);font-size:13px}
.nav .me-acts a.on{color:var(--color-onPrimary);background:none}
.nav .me-acts .btn{background:rgba(247,245,240,.12);color:var(--color-onPrimary);align-self:flex-start}
.card.narrow{max-width:560px}
.fl{display:block;font-size:13px;font-weight:600;color:var(--color-ink2);margin:14px 0 0}
.fl input,.fl textarea{display:block;width:100%;margin-top:6px;box-sizing:border-box}
.fl input[type=datetime-local]{border:1px solid var(--color-hairline);background:var(--color-bg);border-radius:10px;padding:9px 11px;font-size:14.5px;font-weight:400}
.note-warn{background:#FBF3E2;color:#6B5320;border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:6px}
.err-line{color:var(--color-negative);font-size:13.5px;margin:8px 0 0}
.crumbline{margin:0 0 12px}.crumbline a{color:var(--color-primary);font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;min-height:44px;align-items:center}
.lede{color:var(--color-ink2);font-size:14px;max-width:680px;margin:0 0 14px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--color-ink2);min-height:44px;white-space:nowrap}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:#D9D4C7;position:relative;margin:0;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked{background:var(--color-primary)}.switch input:checked::after{transform:translateX(18px)}
.daily-card{margin-bottom:14px}.review-card{margin-bottom:14px;background:#FBF3E2}
.rv-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(0,0,0,.06);font-size:13.5px}
.fail-banner{background:#F8ECE6;color:#7A3A26;margin-bottom:14px;font-size:14px;line-height:1.5}.fail-banner a{color:#7A3A26;font-weight:600}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--color-ink3)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.crest{width:56px;height:56px;border-radius:14px;background:var(--color-bg);display:grid;place-items:center;overflow:hidden;flex:none}
.crest img{width:100%;height:100%;object-fit:contain}
.crest.mono{background:var(--color-primary);color:var(--color-accent);font-weight:700;font-size:18px;letter-spacing:.02em}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.clubhead{display:flex;gap:14px;align-items:center}
.minis{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.minis a{flex:1;min-width:70px;text-decoration:none;background:var(--color-bg);border-radius:12px;padding:8px 10px}
.minis a:hover{background:var(--color-surface2)}
.minis b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--color-primary)}
.minis span{font-size:11.5px;color:var(--color-ink3)}
.ed td{padding:5px 6px}.ed input{width:66px;padding:6px 7px;font-size:13.5px;font-variant-numeric:tabular-nums;text-align:right}
.ed input.chg{border-color:var(--color-accent);background:var(--color-accentSoft)}
.ed .orig{display:block;font-size:10.5px;color:var(--color-ink3);text-align:right;margin-top:2px}
.ed tr.warn td:first-child{box-shadow:inset 3px 0 0 var(--color-negative)}
.ed tr.fixed td:first-child{box-shadow:inset 3px 0 0 var(--color-accent)}
.gpsrow input{width:118px;text-align:left}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.toolbar select{width:auto;padding:7px 9px;font-size:13.5px}
.muted{color:var(--color-ink3)}
.crumbs{margin:0 0 12px;font-size:13px}.crumbs a{color:var(--color-ink2);text-decoration:none}.crumbs a:hover{color:var(--color-primary)}
/* ---------- responsive (v9): iPad, iPhone, touch ---------- */
.tbl td.nw{white-space:nowrap}
.top{padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}
@media (max-width:1100px){.wrap{padding:18px 18px 60px}.app{grid-template-columns:208px minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .nav{position:sticky;top:0;z-index:8;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:8px max(10px,env(safe-area-inset-left));gap:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;flex:none}
  .top{position:static;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
  .top h1{font-size:18px}
  .grid{grid-template-columns:1fr}.side{position:static}
  .filters select,.filters input[type=text],.filters input[type=search]{min-width:0;width:100%}
  .filters>div,.filters>label{flex:1 1 150px;min-width:0}
}
@media (max-width:640px){
  .wrap{padding:14px max(12px,env(safe-area-inset-left)) calc(60px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right))}
  .two,.charts,.clubs,.list{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile .v{font-size:26px}
  .kv{grid-template-columns:110px minmax(0,1fr)}
  .row2{grid-template-columns:1fr}
  /* data tables become cards (the editable card/GPS tables keep a clean horizontal scroll) */
  .tscroll{margin:0;padding:0}
  .sort-hint{display:none}
  .tbl:not(.ed) thead{display:none}
  .tbl:not(.ed),.tbl:not(.ed) tbody,.tbl:not(.ed) tr,.tbl:not(.ed) td{display:block;width:100%}
  .tbl:not(.ed) tr{padding:10px 2px;border-bottom:1px solid var(--color-hairline)}
  .tbl:not(.ed) tr:last-child{border-bottom:0}
  .tbl:not(.ed) td{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border:0;text-align:right;white-space:normal}
  .tbl:not(.ed) td::before{content:attr(data-l);color:var(--color-ink3);font-size:12px;font-weight:500;text-align:left;flex:none;max-width:45%}
  .tbl:not(.ed) td:not([data-l])::before,.tbl:not(.ed) td[data-l=""]::before{content:none}
  .tbl:not(.ed) td:first-child{font-weight:600;font-size:14.5px}
  .tbl.ed{min-width:max-content}
  .ed td:first-child,.ed th:first-child{position:sticky;left:0;background:var(--color-surface);z-index:1}
  .hzh{display:none}
  .hz{grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 40px;row-gap:6px}
  .hz>:nth-child(1){grid-area:1/1/3/2;align-self:start;margin-top:10px}
  .hz>:nth-child(2){grid-area:1/2}.hz>:nth-child(3){grid-area:1/3}.hz>:nth-child(7){grid-area:1/4}
  .hz>:nth-child(4){grid-area:2/2}.hz>:nth-child(5){grid-area:2/3}
  .hz>.note{grid-area:3/2/4/5}
  .levels{grid-template-columns:1fr}
}
@media (pointer:coarse){
  .btn{min-height:44px}.btn.sm{min-height:40px;padding:9px 14px}
  .nav a{min-height:44px}
  .hrow{min-height:44px}
  input[type=text],input[type=number],input[type=search],select{min-height:44px}
  .ed input,.hz input,.hz select{min-height:40px}
  .hz .x{min-width:40px;min-height:40px}
  .crumbs a{display:inline-block;padding:10px 0}
  .tbl td a{display:inline-block;padding:13px 0;margin:-13px 0}
  .filters .chk{min-height:44px;padding-bottom:0}
  .filters .chk input{width:22px;height:22px}
}

/* ---------- clubes de Argentina ---------- */
.sindato{color:var(--color-ink3);font-weight:500}
.tiles.arc{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
@media (max-width:560px){.tiles.arc{grid-template-columns:1fr 1fr;gap:8px}.tiles.arc .tile{padding:10px 12px}.tiles.arc .v{font-size:24px;margin:2px 0}.tiles.arc .s{font-size:11px}.arfil .filters>div{flex:1 1 45%}}
.pchips{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;margin:-4px 0 4px;scrollbar-width:thin}
.pchip{flex:none;display:inline-flex;gap:6px;align-items:center;text-decoration:none;border-radius:999px;padding:6px 11px;font-size:12.5px;background:var(--color-surface);box-shadow:var(--shadow-card);color:var(--color-ink2);white-space:nowrap}
.pchip b{font-weight:600;color:var(--color-primary)}
.pchip.on{background:var(--color-primary);color:var(--color-onPrimary)}.pchip.on b{color:var(--color-accent)}
.arfil{margin-bottom:14px}.arfil .filters{margin:0}
